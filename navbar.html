<meta name="color-scheme" content="light dark">
<script>
  // Follow the operating system on a first visit.
  //
  // Quarto's own toggle only ever reads localStorage["quarto-color-scheme"]
  // and falls back to the first theme in _quarto.yml — it never consults
  // prefers-color-scheme — so someone on a dark desktop gets a white page
  // until they find the switch. This seeds that key from the system before
  // Quarto's script runs (it lives at the top of <body>; this include is in
  // <head>), so the correct sheet is chosen on the first paint.
  //
  // A second key records the value written here. While the stored scheme
  // still matches it, nobody has touched the toggle and the system stays in
  // charge; the moment the two differ the reader has made an explicit
  // choice, and this stops overriding it.
  (function () {
    var SCHEME = "quarto-color-scheme";
    var SEEDED = "ambiorix-color-scheme-seeded";

    try {
      var stored = window.localStorage.getItem(SCHEME);
      var seeded = window.localStorage.getItem(SEEDED);

      if (stored !== null && stored !== seeded) return;

      var system = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "alternate"
        : "default";

      window.localStorage.setItem(SCHEME, system);
      window.localStorage.setItem(SEEDED, system);
    } catch (e) {
      // Private browsing, or storage disabled. Quarto's default stands.
    }
  })();
</script>
<script>
  // Quarto marks the navbar item for the current *file*, and natively covers
  // /docs/** because the sidebar is bound there. Blog posts and showcase
  // items are left unmarked, so section-level highlighting is filled in here.
  //
  // Note: Quarto rewrites navbar hrefs to absolute URLs at runtime, so the
  // href is resolved through `new URL` and compared by origin rather than
  // pattern-matched. Comparing link text would break the moment a label
  // changes; comparing paths does not.
  document.addEventListener("DOMContentLoaded", function () {
    var normalize = function (p) {
      p = p.replace(/index\.html$/, "");
      return p.length > 1 ? p.replace(/\/$/, "") : p;
    };

    var path = normalize(window.location.pathname);
    var sections = ["/docs", "/blog", "/showcase"];

    var current = sections.find(function (s) {
      return path === s || path.indexOf(s + "/") === 0;
    });
    if (!current && path === "/") current = "/";
    if (!current) return;

    var links = document.querySelectorAll(".navbar-nav .nav-link");
    links.forEach(function (link) { link.classList.remove("active"); });

    links.forEach(function (link) {
      var href = link.getAttribute("href");
      if (!href) return;

      var url;
      try {
        url = new URL(href, window.location.href);
      } catch (e) {
        return;
      }

      // Leaves the book, GitHub and X links alone.
      if (url.origin !== window.location.origin) return;

      if (normalize(url.pathname) === current) {
        link.classList.add("active");
      }
    });
  });
</script>
