project:
  type: website
  output-dir: _site

website:
  title: "Ambiorix"
  site-url: https://ambiorix.dev/
  favicon: images/icon.png
  page-navigation: true

  repo-url: https://github.com/ambiorix-web/ambiorix-docs
  repo-branch: main
  repo-actions: [edit, issue]

  page-footer:
    border: true
    left: "Ambiorix — an unopinionated, minimalist web framework for R."
    right:
      - text: GitHub
        href: https://github.com/ambiorix-web
      - text: Book
        href: https://book.ambiorix.dev/
      - text: CRAN
        href: https://cran.r-project.org/package=ambiorix

  navbar:
    logo: images/icon.png
    logo-alt: "Ambiorix logo"
    left:
      - text: Home
        href: index.qmd
      - text: Docs
        href: docs/index.qmd
      - text: Book
        href: https://book.ambiorix.dev/
      - text: Blog
        href: blog/index.qmd
      - text: Gallery
        href: showcase/index.qmd
    right:
      - icon: github
        href: https://github.com/ambiorix-web
      - icon: twitter-x
        href: https://x.com/ambiorixweb

  sidebar:
    - id: docs
      title: "Documentation"
      style: "docked"
      collapse-level: 3
      contents:
        - text: "Introduction"
          href: docs/index.qmd
        - text: "Get Started"
          href: docs/getting-started/index.qmd

        - section: "Core"
          contents:
            - text: "Hello, World"
              href: docs/ambiorix/hello-world/index.qmd
            - text: "Routing"
              href: docs/ambiorix/routing/index.qmd
            - text: "Parameters"
              href: docs/ambiorix/params/index.qmd
            - text: "Request"
              href: docs/ambiorix/request/index.qmd
            - text: "Response"
              href: docs/ambiorix/response/index.qmd
            - text: "Middleware"
              href: docs/ambiorix/middleware/index.qmd
            - text: "Router"
              href: docs/ambiorix/router/index.qmd
            - text: "Errors"
              href: docs/ambiorix/errors/index.qmd
            - text: "404"
              href: docs/ambiorix/not-found/index.qmd

        - section: "Building"
          contents:
            - text: "Rendering"
              href: docs/ambiorix/rendering/index.qmd
            - text: "Templates"
              href: docs/ambiorix/templates/index.qmd
            - text: "Static Files"
              href: docs/ambiorix/static/index.qmd
            - text: "Websockets"
              href: docs/ambiorix/websocket/index.qmd
            - text: "Async"
              href: docs/ambiorix/async/index.qmd
            - text: "Logger"
              href: docs/ambiorix/logger/index.qmd
            - text: "Stop"
              href: docs/ambiorix/stop/index.qmd
            - text: "Project Structure"
              href: docs/ambiorix/project/index.qmd

        - section: "Deploy"
          contents:
            - text: "Deploy"
              href: docs/ambiorix/deploy/index.qmd
            - text: "Load Balancing"
              href: docs/ambiorix/load-balancing/index.qmd
            - section: "Belgic"
              href: docs/belgic/index.qmd
              contents:
                - text: "Install"
                  href: docs/belgic/install/index.qmd
                - text: "Config"
                  href: docs/belgic/config/index.qmd
                - text: "Run"
                  href: docs/belgic/run/index.qmd

        - section: "Middlewares"
          contents:
            - text: "Overview"
              href: docs/middlewares/index.qmd
            - text: "Agris"
              href: docs/middlewares/agris/index.qmd
            - text: "Alesia"
              href: docs/middlewares/alesia/index.qmd
            - text: "Druid"
              href: docs/middlewares/druid/index.qmd
            - text: "Eburones"
              href: docs/middlewares/eburones/index.qmd
            - text: "Jader"
              href: docs/middlewares/jader/index.qmd
            - text: "Pugger"
              href: docs/middlewares/pugger/index.qmd
            - text: "Scilis"
              href: docs/middlewares/scilis/index.qmd
            - text: "Signaculum"
              href: docs/middlewares/signaculum/index.qmd
            - text: "Slighe"
              href: docs/middlewares/slighe/index.qmd
            - text: "Surf"
              href: docs/middlewares/surf/index.qmd
            - text: "Titan"
              href: docs/middlewares/titan/index.qmd

        - section: "Tooling"
          contents:
            - section: "Generator"
              href: docs/generator/index.qmd
              contents:
                - text: "Install"
                  href: docs/generator/install/index.qmd
                - text: "Usage"
                  href: docs/generator/usage/index.qmd
            - section: "CLI"
              href: docs/cli/index.qmd
              contents:
                - text: "Install"
                  href: docs/cli/install/index.qmd
                - text: "Usage"
                  href: docs/cli/use/index.qmd

        - section: "Examples"
          contents:
            - text: "Overview"
              href: docs/examples/index.qmd
            - text: "RESTful API"
              href: docs/examples/api/index.qmd
            - text: "POST Data"
              href: docs/examples/post/index.qmd

        - section: "Reference"
          contents:
            - text: "Changelog"
              href: docs/ambiorix/changelog/index.qmd

format:
  html:
    theme:
      light:
        - default
        - theme/light.scss
        - theme/base.scss
        - theme/code.scss
        - theme/chrome.scss
        - theme/components.scss
      dark:
        - default
        - theme/dark.scss
        - theme/base.scss
        - theme/code.scss
        - theme/chrome.scss
        - theme/components.scss
    highlight-style:
      light: theme/syntax-light.theme
      dark: theme/syntax-dark.theme
    include-in-header:
      - file: navbar.html
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: scroll
    anchor-sections: true
